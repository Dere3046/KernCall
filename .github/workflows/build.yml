name: Build All GKI
on:
  push:
    paths:
      - 'lib/**'
      - 'src/**'
      - 'Makefile'
      - 'doc/**'
      - 'deps/**'
      - '.gitmodules'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build-matrix:
    strategy:
      matrix:
        kmi:
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:${{ matrix.kmi }}-20260313
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Fetch deps
        run: |
          git clone https://github.com/Dere3046/KallRecon.git deps/KallRecon
          git -C deps/KallRecon checkout 63163fd477897fad97639f5ebca77af655499add
          git clone https://github.com/Dere3046/Type_info.git deps/type_info
          git -C deps/type_info checkout 0480a3951b48cd54374e9c803510669683f8fb55
      - name: Build
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: kerncall-${{ matrix.kmi }}
          path: out/kerncall.ko
